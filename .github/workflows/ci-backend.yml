name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: python -m uv sync --extra dev
      - name: pytest + coverage gate (>=80%)
        run: |
          PYTHONPATH=. python -m uv run pytest tests -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80
      - name: Coverage 100% in critical modules
        run: |
          PYTHONPATH=. python -m uv run pytest \
            tests/test_fsm.py \
            tests/test_boot_rejection.py \
            tests/test_rag_scoring.py \
            --cov=app.core.fsm \
            --cov=app.core.entity_loader \
            --cov=app.rag.scoring \
            --cov-report=term-missing \
            --cov-fail-under=100
      - name: ruff lint
        run: python -m uv run ruff check app tests
      - name: ruff format check
        run: python -m uv run ruff format --check app tests
      - name: mypy
        run: python -m uv run mypy app --ignore-missing-imports
