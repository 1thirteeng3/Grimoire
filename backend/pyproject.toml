[project]
name = "grimoire-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "qdrant-client>=1.9",
    "sentence-transformers>=3.0",
    "onnxruntime>=1.18",
    "optimum[onnxruntime]>=1.20",
    "honcho-ai>=0.0.8",
    "httpx>=0.27",
    "watchdog>=4.0",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "apscheduler>=3.10",
    "keyring>=25.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
