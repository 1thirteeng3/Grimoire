groups:
  - name: grimoire-operational-alerts
    rules:
      - alert: GrimoireLLMProviderTimeoutHigh
        expr: increase(grimoire_errors_total{stage="LLM",error_type="LLM_PROVIDER_TIMEOUT"}[10m]) >= 3
        for: 5m
        labels:
          severity: critical
          service: grimoire-backend
          component: llm
        annotations:
          summary: "Timeouts no provedor LLM acima do limiar"
          description: "Foram detectados {{ $value }} timeouts de LLM nos ultimos 10 minutos."

      - alert: GrimoirePromptBloatRecurring
        expr: increase(grimoire_errors_total{stage="RAG",error_type="PROMPT_BLOAT"}[15m]) >= 5
        for: 10m
        labels:
          severity: warning
          service: grimoire-backend
          component: rag
        annotations:
          summary: "PROMPT_BLOAT recorrente"
          description: "Eventos de prompt bloat recorrentes no RAG (>=5 em 15m)."

      - alert: GrimoireRAGAverageLatencyHigh
        expr: |
          (
            rate(grimoire_stage_latency_ms_total{stage="RAG"}[5m])
            /
            clamp_min(rate(grimoire_stage_operations_total{stage="RAG"}[5m]), 0.001)
          ) > 1200
          and rate(grimoire_stage_operations_total{stage="RAG"}[5m]) > 0.05
        for: 10m
        labels:
          severity: warning
          service: grimoire-backend
          component: rag
        annotations:
          summary: "Latencia media de RAG acima do limiar"
          description: "Latencia media de RAG acima de 1200 ms por 10 minutos."

      - alert: GrimoireLLMAverageLatencyHigh
        expr: |
          (
            rate(grimoire_stage_latency_ms_total{stage="LLM"}[5m])
            /
            clamp_min(rate(grimoire_stage_operations_total{stage="LLM"}[5m]), 0.001)
          ) > 3500
          and rate(grimoire_stage_operations_total{stage="LLM"}[5m]) > 0.02
        for: 10m
        labels:
          severity: warning
          service: grimoire-backend
          component: llm
        annotations:
          summary: "Latencia media de LLM acima do limiar"
          description: "Latencia media de LLM acima de 3500 ms por 10 minutos."
